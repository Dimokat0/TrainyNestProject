<!doctype html>
<html>
  <head>
    <title>Main Page</title>
    <style>
      body {
        color: #333;
        background: linear-gradient(to right, #fff, #cacaca);
        text-align: center;
        padding-top: 100px;
        font-family: Arial, sans-serif;
      }
      a {
        color: #333;
        text-decoration: none;
        padding: 10px;
        border-radius: 5px;
        background: #f2f2f2;
        box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.1);
      }
      a:hover {
        background: #bbb;
      }
      #btns-container {
        display: inline-block;
        padding: 20px;
        border: none;
        border-radius: 15px;
        transition:
          transform 0.1s ease-out,
          box-shadow 0.1s ease-out;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .loginBtn {
        box-sizing: border-box;
        position: relative;
        margin: 0.2em;
        padding: 0 15px 0 46px;
        border: none;
        text-align: left;
        line-height: 34px;
        white-space: nowrap;
        border-radius: 0.2em;
        font-size: 16px;
        color: #fff;
      }
      .loginBtn:before {
        content: '';
        box-sizing: border-box;
        position: absolute;
        top: 0;
        left: 0;
        width: 34px;
        height: 100%;
      }
      .loginBtn:focus {
        outline: none;
      }
      .loginBtn:active {
        box-shadow: inset 0 0 0 32px rgba(0, 0, 0, 0.1);
      }

      .loginBtn--facebook {
        background-color: #4c69ba;
        background-image: linear-gradient(#4c69ba, #3b55a0);
        text-shadow: 0 -1px 0 #354c8c;
      }
      .loginBtn--facebook:before {
        border-right: #364e92 1px solid;
        background: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/14082/icon_facebook.png')
          6px 6px no-repeat;
      }
      .loginBtn--facebook:hover,
      .loginBtn--facebook:focus {
        background-color: #5b7bd5;
        background-image: linear-gradient(#5b7bd5, #4864b1);
        cursor: pointer;
      }

      .loginBtn--google {
        background: #dd4b39;
      }
      .loginBtn--google:before {
        border-right: #bb3f30 1px solid;
        background: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/14082/icon_google.png')
          6px 6px no-repeat;
      }
      .loginBtn--google:hover,
      .loginBtn--google:focus {
        background: #ee5440;
        background-image: linear-gradient(#f14b35, #df5948);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to the Main Page</h1>
    <div id="btns-container">
      <br />
      <a href="/loginPage">Login</a>&nbsp; &nbsp;<a href="/registerPage"
        >Register</a
      >
      <br />
      <br />
      <button id="google-btn" class="loginBtn loginBtn--google">
        Continue with Google
      </button>
      <button id="facebook-btn" class="loginBtn loginBtn--facebook">
        Continue with Facebook
      </button>
    </div>
    <script>
      const google_btn = document.querySelector('#google-btn');
      google_btn.addEventListener('click', () => {
        window.location.href = '/google';
      });
      const facebook_btn = document.querySelector('#facebook-btn');
      facebook_btn.addEventListener('click', () => {
        window.location.href = '/facebook';
      });

      const container = document.getElementById('btns-container');

      let targetX = window.innerWidth / 2;
      let targetY = window.innerHeight / 2;
      let currentX = window.innerWidth / 2;
      let currentY = window.innerHeight / 2;
      let isFollowing = true;

      document.addEventListener('mousemove', (event) => {
        if (isFollowing) {
          targetX = event.clientX;
          targetY = event.clientY;
        }
      });

      document.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        isFollowing = !isFollowing;
      });

      function animate() {
        currentX += (targetX - currentX) * 0.1;
        currentY += (targetY - currentY) * 0.1;

        container.style.left = `${currentX}px`;
        container.style.top = `${currentY}px`;

        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
